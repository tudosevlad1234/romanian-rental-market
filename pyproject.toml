[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romanian-rental-market"
version = "1.0.0"
description = "Respectful scrapers, cleaning, de-duplication and hedonic analysis of Romanian rental listings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "patsy>=0.5",
]

[project.optional-dependencies]
selenium = ["selenium>=4.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rentals = "rentals.__main__:main"

[tool.setuptools.packages.find]
include = ["rentals*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
